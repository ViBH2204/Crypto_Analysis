name: Daily Crypto ETL Pipeline

on:
  schedule:
    # Runs at 09:00 AM UTC every day (Adjust UTC offset for your local time)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas sqlalchemy

    - name: Execute Daily ETL
      run: python etl_pipeline.py

    - name: Commit and Push Updated SQLite DB
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add crypto_analytics.db
        git diff-index --quiet HEAD || git commit -m "Automated daily crypto database update"
        git push