name: Daily Crypto ETL Pipeline

on:
  schedule:
    # Runs at 03:30 UTC (which is 9:00 AM IST)
    # Note: If you want 9:00 AM UTC instead, change '30 3' to '0 9'
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute ETL Pipeline
      run: python etl_pipeline.py

    - name: Commit and Push Updated SQLite Database
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add crypto_analytics.db
        git diff-index --quiet HEAD || git commit -m "Automated daily database update"
        git push